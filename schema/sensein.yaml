      workshop:
        meaning: fabio:WorkshopPaper
      software:
        meaning: fabio:ComputerProgram
      patent:
        meaning: fabio:PatentDocument
      dataset:
        meaning: fabio:DataFile

  PublicationCategory:
    description: Kind of contribution, independent of form.
    permissible_values:
      original-research:
        meaning: fabio:ResearchPaper
      methods:
        meaning: fabio:MethodsPaper
      software:
        meaning: fabio:ComputerProgram
      review:
        meaning: fabio:ReviewArticle
      perspective:
        meaning: fabio:Opinion
      commentary:
        meaning: fabio:Comment
      editorial:
        meaning: fabio:Editorial
      dataset:
        meaning: fabio:DataPaper
      benchmark:
        description: A benchmark or evaluation study.
      tutorial:
        meaning: schema:LearningResource

  DataSource:
