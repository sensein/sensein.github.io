      arxiv:
        description: arXiv.
      openalex:
        description: OpenAlex.
      crossref:
        description: Crossref.
      publisher:
        description: The publisher's website.
      cv:
        description: A lab member's CV.
      preprint-sweep:
        description: The lab's periodic sweep of preprint servers.
      site-yaml-v1:
        description: The site's YAML data files before the move to the knowledge graph.

  AccountService:
