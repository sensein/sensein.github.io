enums:

  MembershipStatus:
    permissible_values:
      current:
        description: Holds the role now.
      former:
        description: Held the role in the past.

  RoleCategory:
    description: Coarse role categories for grouping the roster.
    permissible_values:
      principal_investigator:
        description: Lab director and principal investigator.
      research_scientist:
        description: Research scientist or senior research staff.
      postdoc:
        description: Postdoctoral associate or fellow.
      engineer:
        description: Software or research engineer.
      technical_staff:
        description: Technical associate, assistant or intern.
      administrative_staff:
        description: Administrative staff.
      graduate_student:
        description: PhD, MD-PhD, MEng or master's student.
      undergraduate:
        description: Undergraduate researcher.
      visitor:
        description: Visiting student or scientist.
      affiliate:
        description: Research affiliate.
      other:
        description: Any other role.

  RosterSection:
    permissible_values:
      members:
        description: Listed under current members.
      students:
        description: Listed under students.

  ProjectStatus:
    permissible_values:
      active:
        description: Ongoing.
        meaning: schema:ActiveActionStatus
      former:
        description: Completed or paused.
        meaning: schema:CompletedActionStatus

  ProjectType:
    permissible_values:
      lab_project:
        description: A project the lab runs or co-leads, with a page of its own.
