  headline: >-
    New projects: 1) Creating a knowledgebase of the brain together  with the Allen Institute for Brain
    Science as part of the  <a href="https://www.nimh.nih.gov/news/science-news/2022/nih-brain-initiative-launches-projects-to-develop-cell-atlases-and-molecular-tools-for-cell-access">
