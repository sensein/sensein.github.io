  slug: bridge2ai-voice
  title: Bridge2AI Voice
  project_type: lab_project
  project_status: active
  description: >-
    Build an ethically-sourced, diverse, AI-ready database of 10 000 human voices linked to health information
    across five disease categories: cardio-respiratory, mood, pediatric speech, voice, and neurological
