- id: sid:project/banda
  slug: banda
  title: BANDA — Boston Adolescent Neuroimaging of Depression and Anxiety
  project_type: lab_project
  project_status: active
  description: >-
    A Human Connectome Project arm (Connectomes Related to Human Diseases) collecting multimodal MRI,
    clinical, and neuropsychological data from 215 adolescents aged 14–17, 152 of whom had current anxiety
    and/or depressive disorders at intake. Imaging spans structural (T1/T2), resting-state and task fMRI,
    and diffusion-weighted scans, released as both unprocessed and HCP minimally-preprocessed data. The
    lab contributed the imaging pipelines, quality assurance, and data-release engineering, and continues
    to support connectome-based predictive-modeling analyses of depression and anxiety risk across BANDA
    and ABCD.
  funding_statement: NIMH — Connectomes Related to Human Diseases (Human Connectome Project)
