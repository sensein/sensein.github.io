- id: sid:project/abstract-atlas
  slug: abstract-atlas
  title: Abstract Atlas — browseable embedding map of conference abstracts and PubMed
  project_type: lab_project
  project_status: active
  description: >-
    A static, browser-side atlas for searching and exploring the neuroscience literature landscape via
    embedding-space visualisation. Pulls OHBM 2026 abstracts (Oxford Abstracts GraphQL API) and a NeuroScape
    PubMed corpus, enriches each record with figure analysis and OpenAlex reference matching, generates
    embeddings (Voyage, MiniLM-L6, OpenAI, PubMedBERT, sentence-transformers), reduces with UMAP, and
    serves the result as a SvelteKit site with lexical search, semantic search (transformers.js, MiniLM-ONNX
    in-browser), faceted filters, and dual semantic-cluster lenses. The lab uses it to map OHBM 2026 against
    the wider PubMed neuroimaging atlas.
  funding_statement: Lab infrastructure (no external grant)
  image: sid:image/projects/abstract-atlas-placeholder
