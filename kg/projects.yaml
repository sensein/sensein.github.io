    to help teachers quickly and reliably identify children needing early-literacy intervention. The project
    ran the DrivenData "Goodnight Moon, Hello Early Literacy Screening" public competition in 2024–2025
    (winning AUROC 0.97 vs Whisper baseline 0.59), with a voice-cloning anonymization scheme for data
